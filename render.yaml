services:
  - type: web
    name: pengwin-backend
    runtime: python
    rootDir: backend/lingai
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pengwin-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: llama3-8b-8192
      - key: FRONTEND_ORIGINS
        value: http://localhost:3000,https://pengwin.vercel.app

databases:
  - name: pengwin-db
    plan: free
